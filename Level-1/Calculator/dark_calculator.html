<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark calculatort</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h2 class="sr-only" style="position: absolute; left: -9999px">
      Dark theme calculator with expression display and standard operations
    </h2>
    <div class="calc-wrap">
      <div class="calc">
        <div class="display">
          <div class="expr" id="expr"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="grid" id="main-grid">
          <button class="btn btn-util">(</button>
          <button class="btn btn-util">)</button>
          <button class="btn btn-util">ans</button>
          <button class="btn btn-util btn-del">del</button>
          <button class="btn btn-util btn-clear">clear</button>
          <button class="btn btn-num">7</button>
          <button class="btn btn-num">8</button>
          <button class="btn btn-num">9</button>
          <button class="btn btn-op">%</button>
          <button class="btn btn-op btn-sqrt">√</button>
          <button class="btn btn-num">4</button>
          <button class="btn btn-num">5</button>
          <button class="btn btn-num">6</button>
          <button class="btn btn-op">×</button>
          <button class="btn btn-op">÷</button>
          <button class="btn btn-num">1</button>
          <button class="btn btn-num">2</button>
          <button class="btn btn-num">3</button>
          <button class="btn btn-op">+</button>
          <button class="btn btn-op">−</button>
        </div>
        <div class="bottom-row" style="margin-top: 8px">
          <button class="btn btn-num">.</button>
          <button class="btn btn-num">0</button>
          <button class="btn btn-op">±</button>
          <button class="btn btn-enter">ENTER</button>
        </div>
      </div>
    </div>
    <script src="script.js
"></script>
  </body>
</html>
